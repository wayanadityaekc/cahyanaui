<section class="booking" id="booking">
  <div class="booking__card">
    <h2 class="booking__title">Build Your Trip</h2>
    <div class="booking__fields">
      <div class="booking__group">
        <label for="stay-area">Pickup Area</label>
        <select id="stay-area" data-stay-select aria-label="Pickup area">
          <option value="ubud">Ubud &amp; nearby</option>
        </select>
      </div>
      <div class="booking__group">
        <label for="date">Date</label>
        <input type="date" id="date" />
      </div>
      <div class="booking__group">
        <label for="service">Service</label>
        <select id="service">
          <option value="" disabled selected>Service</option>
          <option value="tour">Tour Program</option>
          <option value="experience">Experience</option>
          <option value="performance">Performance</option>
          <option value="transfer">Route Transfer</option>
        </select>
      </div>
      <div class="booking__group">
        <label for="service-item">Select Service</label>
        <select id="service-item">
          <option value="" disabled selected>Choose</option>
        </select>
      </div>
      <div class="booking__group booking__group--price">
        <label for="price"
          >Price
          <span class="binfo">
            <button
              type="button"
              class="binfo__btn"
              data-binfo
              aria-expanded="false"
              aria-label="How to use this form"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><line x1="12" y1="11" x2="12" y2="16" /><circle cx="12" cy="7.6" r="0.7" fill="currentColor" stroke="none" /></svg>
            </button>
            <div class="binfo__pop" role="tooltip">
              <p class="binfo__lead">Set your pickup area and date, pick a service, choose a price type, then tap Book Now.</p>
              <div class="binfo__row">
                <span class="binfo__tag">Standard</span>
                <p>You pay entrance tickets at each place, only for the spots you actually enter.</p>
              </div>
              <div class="binfo__row">
                <span class="binfo__tag binfo__tag--gold">Exclusive</span>
                <p>All entrance tickets are prepaid, so the whole day is sorted upfront with no cash needed.</p>
              </div>
            </div>
          </span>
        </label>
        <div class="booking__type" id="booking-type">
          <button type="button" class="booking__type-btn is-active" data-mode="standard">Standard</button>
          <button type="button" class="booking__type-btn" data-mode="exclusive">Exclusive</button>
        </div>
        <div class="booking__price" id="price">-</div>
        <small class="booking__note" id="price-note"></small>
        <small class="booking__surcharge" id="price-surcharge"></small>
      </div>
      <div class="booking__actions">
        <button class="booking__btn" id="book-now">Book Now</button>
        <a class="booking__btn booking__btn--alt" href="my-trips.html"
          >My Trips</a
        >
      </div>
    </div>
  </div>
</section>

<!-- Modal konfirmasi ada di partial terpisah, di-load lewat placeholder ini -->
<div id="book-confirm-placeholder"></div>
