<!-- Unified booking confirmation modal - dipakai semua flow (tour/experience/transfer/charter/itinerary). Diisi & dibuka lewat window.__openBooking() -->
<div class="modal" id="booking-modal">
  <div class="modal__box">
    <button class="modal__close" id="modal-close" aria-label="Close">
      &times;
    </button>
    <div id="modal-form">
      <h3 class="modal__title">Confirm Your Booking</h3>
      <div class="modal__group">
        <label for="booker-name">Your Name</label
        ><input type="text" id="booker-name" placeholder="Enter your name" />
      </div>
      <div class="modal__group">
        <label for="booker-phone">Phone Number</label
        ><input
          type="tel"
          id="booker-phone"
          placeholder="e.g. +61 412 345 678"
        />
      </div>
      <div class="modal__group">
        <label for="booker-email">Email</label
        ><input type="email" id="booker-email" placeholder="you@email.com" />
      </div>
      <div class="modal__group">
        <label for="pickup" id="pickup-label">Pick-up Location</label
        ><input
          type="text"
          id="pickup"
          placeholder="Hotel / villa name or area"
        />
      </div>
      <div class="modal__group">
        <label for="dropoff" id="dropoff-label">Drop-off Location</label
        ><input
          type="text"
          id="dropoff"
          placeholder="Where should we drop you off?"
        />
      </div>
      <div class="modal__group">
        <label for="referral">Referral Code (optional)</label>
        <div class="modal__referral">
          <input type="text" id="referral" placeholder="Enter code" /><button
            type="button"
            id="apply-referral"
          >
            Apply
          </button>
        </div>
        <small class="modal__referral-msg" id="referral-msg"></small>
      </div>
      <div class="modal__summary">
        <div class="modal__row">
          <span>Guests</span><span id="sum-guest">-</span>
        </div>
        <div class="modal__row">
          <span>Service</span><span id="sum-service">-</span>
        </div>
        <div class="modal__row">
          <span>Date</span><span id="sum-date">-</span>
        </div>
        <div class="modal__row">
          <span>Price</span><span id="sum-price">-</span>
        </div>
      </div>
      <div class="modal__details" id="modal-details">
        <button type="button" class="modal__details-toggle" id="details-toggle">
          <span>What's included</span
          ><span class="modal__details-arrow">&rsaquo;</span>
        </button>
        <ul class="modal__details-list" id="details-list"></ul>
      </div>
      <div class="modal__pay">
        <div class="modal__pay-logos">
          <span class="modal__pay-chip">
            <svg class="modal__pay-svg" viewBox="0 0 48 16" role="img" aria-label="Visa">
              <text x="24" y="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="italic" letter-spacing="0.5" fill="#1434CB">VISA</text>
            </svg>
          </span>
          <span class="modal__pay-chip">
            <svg class="modal__pay-svg" viewBox="0 0 40 24" role="img" aria-label="Mastercard">
              <circle cx="15" cy="12" r="9" fill="#EB001B" />
              <circle cx="25" cy="12" r="9" fill="#F79E1B" />
              <path d="M20 4.52 A9 9 0 0 0 20 19.48 A9 9 0 0 0 20 4.52 Z" fill="#FF5F00" />
            </svg>
          </span>
          <span class="modal__pay-chip">
            <svg class="modal__pay-svg" viewBox="0 0 62 16" role="img" aria-label="PayPal">
              <text x="0" y="13" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="italic"><tspan fill="#003087">Pay</tspan><tspan fill="#009CDE">Pal</tspan></text>
            </svg>
          </span>
        </div>
      </div>
      <button class="modal__btn" id="book-submit">Book Now</button>
      <button class="modal__btn modal__btn--wa" id="discuss-wa">
        Discuss via WhatsApp
      </button>
    </div>
    <div class="modal__success" id="modal-success">
      <div class="modal__success-icon">&check;</div>
      <h3 class="modal__title">Booking Received!</h3>
      <p>Thank you. We will email you shortly to confirm your booking.</p>
      <button class="modal__btn" id="success-close">Done</button>
    </div>
  </div>
</div>
