<!-- Review submission popup. Login-only (Sep 2026, QA #16 decision) - only ever
     opened via openReviewModal(prefill) from the "Leave a Review" button on a real
     booking card in My Trips (logged in). No more anonymous booking-ref+contact
     path - a real booking under the logged-in account is required, full stop.
     Straight to the write step, prefilled with name from the booking, submit
     via session token.
     If the booking has more than 1 distinct tour (custom itinerary), a "Which
     tours" checklist appears - guest checks whichever ones they want to review,
     each checked one gets its OWN rating+text box (#rvm-checklist/#rvm-blocks,
     filled by JS in enterWriteStep). Submit sends one review per checked tour
     (can differ per tour), not just one review for everything.
     All wiring in openReviewModal/wireReviewModal (script.js). -->
<div class="modal" id="review-modal">
  <div class="modal__box">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <h3 class="modal__title">Leave a Review</h3>

    <div data-step="write">
      <div class="modal__group">
        <label for="rvm-name">Your name</label>
        <input type="text" id="rvm-name" />
      </div>
      <div class="modal__group">
        <label for="rvm-country">Country (optional)</label>
        <select id="rvm-country">
          <option value="">Select country</option>
        </select>
      </div>
      <div id="rvm-checklist"></div>
      <div id="rvm-blocks"></div>
      <p class="review-modal__error" id="rvm-submit-error" hidden></p>
      <button type="button" class="modal__btn" id="rvm-submit-btn">Submit review</button>
    </div>

    <div class="modal__success" id="rvm-success">
      <div class="modal__success-icon">&check;</div>
      <h3 class="modal__title">Thank you!</h3>
      <p>Your review has been submitted and will appear once approved.</p>
      <button type="button" class="modal__btn" data-close>Done</button>
    </div>
  </div>
</div>
