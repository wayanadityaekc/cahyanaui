<section class="reviews" id="reviews">
  <!-- Header row V1: judul kiri + link "See all" kanan sebaris -->
  <div class="reviews__head">
    <h2 class="section__title">Guest Reviews</h2>
    <a class="reviews__seeall" href="#" target="_blank" rel="noopener">See all reviews &rsaquo;</a>
  </div>

  <!-- Default state: no fake reviews (see CLAUDE.md - no fake content). initReviews()
       (script.js) fetches approved reviews and replaces this markup when at least one
       exists; on empty/error it's left as-is so the section always shows something real. -->
  <div class="reviews-strip">
    <div class="reviews__empty">
      <p>Reviews are on their way - be one of the first to share your trip.</p>
      <button type="button" class="btn-pill" data-review-empty-cta>Leave a review</button>
    </div>
  </div>
</section>
