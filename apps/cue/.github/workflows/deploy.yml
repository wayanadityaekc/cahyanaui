name: Build and publish to deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

# The publish step force-pushes the built out/ to the deploy branch, so the
# workflow token needs write access to repo contents (default is read-only).
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # RETIRED (Wayan, full Tailwind migration): the two legacy-parity gates
      # below assumed style.css is the source of truth and out/ must match the
      # legacy HTML class-for-class. Tailwind utilities live in @theme, not
      # style.css, and change class counts by design - so these no longer apply.
      # - name: Verify every component class exists in style.css
      #   run: node tools/check-classes.js
      # - name: Verify ported pages still match the originals
      #   run: bash tools/diff-ported.sh

      - run: npm run build

      - name: Verify every expected URL was built
        run: node tools/check-urls.js

      - name: Verify structured data survived the port
        run: node tools/check-schema.js

      - name: Verify the detail pages keep their intended shape
        run: node tools/check-detail.js

      - name: Verify extracted content still matches the legacy source
        run: node tools/check-content-fresh.js

      - name: Verify every referenced asset exists and pages carry a favicon
        run: node tools/check-assets.js

      - name: Publish out/ to the deploy branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
