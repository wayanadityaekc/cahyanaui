<div class="hero__search" id="hero-search">
  <h2 class="hsearch__title">Plan your trip</h2>
  <p class="hsearch__sub">See your real total upfront, before you book.</p>

  <div class="hsearch__field hsearch__dd">
    <label
      >How do you want to explore?
      <span class="binfo">
        <button
          type="button"
          class="binfo__btn"
          data-binfo
          aria-expanded="false"
          aria-label="How to use this form"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><line x1="12" y1="11" x2="12" y2="16" /><circle cx="12" cy="7.6" r="0.7" fill="currentColor" stroke="none" /></svg>
        </button>
        <div class="binfo__pop" role="tooltip">
          <p class="binfo__lead">Pick what you want to do, choose your dates, set how many guests and where we pick you up, then choose your currency. Tap Explore to see the options with real prices.</p>
          <p class="binfo__note">On each program page you can choose Standard or Exclusive when you book.</p>
        </div>
      </span>
    </label>
    <button type="button" class="hs-control" data-explore-btn aria-haspopup="listbox" aria-expanded="false">
      <span class="hs-control__val placeholder" data-explore-label>Choose an experience</span>
      <svg class="hs-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
    </button>
    <div class="hs-panel" data-explore-panel>
      <div class="hs-panel__head"><h3>How to explore</h3><button type="button" class="hs-panel__close" data-hs-close aria-label="Close">&times;</button></div>
      <div class="hs-panel__body">
        <button type="button" class="hs-opt" data-explore-opt data-href="tour.html" data-name="Tour programs">
          <span class="hs-opt__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-6h14l2 6M5 13h14v4H5zM3 13h18" /><circle cx="8" cy="17" r="1.5" /><circle cx="16" cy="17" r="1.5" /></svg></span>
          <span class="hs-opt__nm">Tour programs<small>Full-day private tours</small></span>
          <span class="hs-opt__pr" data-explore-pr="tour"></span>
        </button>
        <button type="button" class="hs-opt" data-explore-opt data-href="transfer.html" data-name="Transfers">
          <span class="hs-opt__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="9" rx="2" /><circle cx="7.5" cy="18" r="1.6" /><circle cx="16.5" cy="18" r="1.6" /></svg></span>
          <span class="hs-opt__nm">Transfers<small>Airport &amp; area routes</small></span>
          <span class="hs-opt__pr" data-explore-pr="transfer"></span>
        </button>
        <button type="button" class="hs-opt" data-explore-opt data-href="activities.html" data-name="Experiences">
          <span class="hs-opt__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" /><path d="M5 8c3 0 5 2 7 4 2-2 4-4 7-4" /></svg></span>
          <span class="hs-opt__nm">Experiences<small>ATV, rafting, swing &amp; more</small></span>
          <span class="hs-opt__pr" data-explore-pr="experience"></span>
        </button>
        <button type="button" class="hs-opt" data-explore-opt data-href="charter.html" data-name="Charter">
          <span class="hs-opt__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l2-9h12l2 9M2 17h20M9 8V5h6v3" /></svg></span>
          <span class="hs-opt__nm">Charter<small>Car + driver, your route</small></span>
          <span class="hs-opt__pr" data-explore-pr="charter"></span>
        </button>
        <button type="button" class="hs-opt" data-explore-opt data-href="itinerary.html" data-name="Itinerary">
          <span class="hs-opt__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2" /><path d="M8 8h8M8 12h8M8 16h5" /></svg></span>
          <span class="hs-opt__nm">Itinerary<small>Build your trip day by day</small></span>
          <span class="hs-opt__pr" data-explore-pr="itinerary"></span>
        </button>
        <button type="button" class="hs-opt" data-explore-opt data-href="destinations.html" data-name="Destinations">
          <span class="hs-opt__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></svg></span>
          <span class="hs-opt__nm">Destinations<small>Temples, beaches &amp; rice terraces</small></span>
          <span class="hs-opt__pr" data-explore-pr="destination"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="hsearch__field hsearch__dt">
    <label>When</label>
    <button type="button" class="hs-control" data-date-btn aria-expanded="false">
      <span class="hs-control__val placeholder" data-date-label>Add dates</span>
      <svg class="hs-chev hs-chev--cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5" /><path d="M3 9h18M8 2.5v4M16 2.5v4" /></svg>
    </button>
    <div class="hs-panel hs-panel--cal" data-date-panel>
      <div class="hs-panel__head"><h3>Select dates</h3><button type="button" class="hs-panel__close" data-hs-close aria-label="Close">&times;</button></div>
      <div class="hs-cal" data-cal-body></div>
      <div class="hs-cal__foot">
        <span class="hs-cal__hint" data-cal-hint>Add your start date</span>
        <button type="button" class="hs-cal__apply" data-cal-apply>Apply</button>
      </div>
    </div>
  </div>

  <!-- Guests + Pickup: nyetir state trip global (guests -> harga Exclusive; pickup ->
       surcharge). Native select biar UX HP enak; disinkron sama tripbar/booking. -->
  <div class="hsearch__row2">
    <div class="hsearch__field">
      <label for="hs-guests">Guests</label>
      <select id="hs-guests" class="hsearch__select" data-guest-select aria-label="Number of guests">
        <option value="1">1 guest</option>
        <option value="2" selected>2 guests</option>
        <option value="3">3 guests</option>
        <option value="4">4 guests</option>
        <option value="5">5 guests</option>
        <option value="6">6 guests</option>
        <option value="7">7 guests</option>
        <option value="8">8 guests</option>
        <option value="9">9 guests</option>
        <option value="10">10 guests</option>
      </select>
    </div>
    <div class="hsearch__field">
      <label for="hs-stay">Pickup area</label>
      <select id="hs-stay" class="hsearch__select" data-stay-select aria-label="Pickup area">
        <option value="ubud">Ubud &amp; nearby</option>
      </select>
    </div>
  </div>

  <!-- Currency: pindahan dari welcome popup. Custom dropdown berbendera (wireCurDropdown). -->
  <div class="hsearch__field hsearch__cur">
    <label>Show prices in</label>
    <div class="acct__cur" data-cur>
      <button type="button" class="acct__curbtn" data-cur-toggle aria-haspopup="listbox" aria-expanded="false">
        <span class="acct__flag" data-cur-flag><svg viewBox="0 0 60 40" aria-hidden="true"><use href="#flag-usd" /></svg></span>
        <span class="acct__curcode" data-cur-label>USD</span>
        <svg class="acct__curcaret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <ul class="acct__curlist" data-cur-list role="listbox" aria-label="Currency" hidden>
        <li class="acct__curopt" role="option" data-cur-opt="USD"><span class="acct__flag"><svg viewBox="0 0 60 40" aria-hidden="true"><use href="#flag-usd" /></svg></span>USD</li>
        <li class="acct__curopt" role="option" data-cur-opt="IDR"><span class="acct__flag"><svg viewBox="0 0 60 40" aria-hidden="true"><use href="#flag-idr" /></svg></span>IDR</li>
        <li class="acct__curopt" role="option" data-cur-opt="AUD"><span class="acct__flag"><svg viewBox="0 0 60 40" aria-hidden="true"><use href="#flag-aud" /></svg></span>AUD</li>
        <li class="acct__curopt" role="option" data-cur-opt="EUR"><span class="acct__flag"><svg viewBox="0 0 60 40" aria-hidden="true"><use href="#flag-eur" /></svg></span>EUR</li>
        <li class="acct__curopt" role="option" data-cur-opt="GBP"><span class="acct__flag"><svg viewBox="0 0 60 40" aria-hidden="true"><use href="#flag-gbp" /></svg></span>GBP</li>
      </ul>
    </div>
  </div>

  <button type="button" class="hsearch__go" data-explore-go>Explore</button>
</div>
