name: Build and publish to deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify every component class exists in style.css
        run: node tools/check-classes.js

      - run: npm run build

      - name: Verify every expected URL was built
        run: node tools/check-urls.js

      - name: Verify ported pages still match the originals
        run: >
          node tools/diff-classes.js index.html tour.html activities.html
          destinations.html contact.html faq.html about-us.html all-reviews.html
          terms-conditions.html privacy-policy.html cancellation-policy.html
          transfer.html charter.html airport-transfer.html bali-guide.html

      - name: Publish out/ to the deploy branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
